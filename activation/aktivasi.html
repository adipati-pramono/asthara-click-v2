:root{--ink:#2E2F3B;--sl:#2E2F3A;--g:#C88246;--gd:#915010;--bg:#F4F5F7;--cd:#fff;--ln:#E8E2D5;--mu:#6B6F7B;--ok:#00875A;--okb:#E1F2E8;--wn:#B45309;--wnb:#FCEBD0;--bd:#B0024A;--bdb:#F8DDE2;--in:#1F6CC9;--inb:#E2ECF8;--gyb:#F3EFE7;--inp:#fff;--thc:#915010;--thb:#F8F3E8;--thl:#EFE3D0}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans','DM Sans',system-ui,sans-serif}
button,select{font:inherit}button{cursor:pointer}
.bar{position:sticky;top:0;z-index:6;background:var(--sl);color:#D4D1DE;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;min-height:52px}
.bar b{color:#F5C896;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.bar select{background:#3A3C4B;color:#fff;border:1px solid #4A4C5D;border-radius:8px;min-height:36px;padding:0 10px;max-width:260px}
.bs{background:0;border:1px solid #4A4C5D;color:#D4D1DE;border-radius:8px;min-height:36px;padding:0 12px;font-size:13px}.bs:hover{background:#383A4B}.bs.on{background:rgba(190,133,81,.35);color:#fff;border-color:var(--g)}.bs:disabled{opacity:.4;cursor:default}
.sg{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.sx{display:flex;min-height:calc(100vh - 52px)}
.bp2{width:36%;max-width:480px;flex:none;margin:16px;border-radius:24px;padding:48px 52px;color:#fff;display:flex;flex-direction:column;gap:40px;background:radial-gradient(circle at 85% 8%,rgba(176,128,80,.3),rgba(176,128,80,0) 45%),#2E2F3B;position:sticky;top:68px;height:calc(100vh - 84px)}
.bp2 .t{color:#F5C896;font-weight:600;font-size:14px;margin-top:22px}
.bp2 .k{margin-top:auto}.bp2 .k h2{margin:0;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.01em;color:#fff}.bp2 .k h2 span{color:#C88246}
.bp2 .k h3{margin:14px 0 0;font-size:20px;line-height:1.25;color:#fff}.bp2 .k p{margin:18px 0 0;color:#A9ABB8;font-size:15px;font-weight:600;line-height:1.6;max-width:360px}
.bp2 .f{margin-top:auto;color:#8A8C9A;font-size:12px;font-weight:600}
.fw{flex:1;min-width:0;padding:44px 32px 64px}.fw>.in2{max-width:560px;margin:0 auto}
.eb{font-size:12px;font-weight:700;letter-spacing:.1em;color:#8A5A1E}
h1{margin:2px 0 6px;font-size:28px;line-height:1.2;letter-spacing:-.01em}.s{color:var(--mu)}
.cdx{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:20px;margin-top:20px}
.nt{margin:0 0 14px;font-size:13px;color:#6E6A60}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fm .w{grid-column:1/-1}
h2{margin:22px 0 12px;font-size:15px}
.lb{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555A66;margin:0 0 6px}
.lb em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:600}.lb .fx{color:var(--wn)}.lb .op{color:var(--mu);font-weight:500}
.in{width:100%;min-height:46px;border:1px solid #D6CDB8;border-radius:8px;background:#fff;color:var(--ink);padding:0 14px;font:inherit}
.in:focus{outline:2px solid rgba(190,133,81,.45);border-color:var(--g)}
.in.need{border-color:#E3B76B;background:#FFFBF2}.in.bad{border-color:var(--bd)}
.lk{position:relative}.lk .in{background:var(--gyb);color:#6F6C64;padding-right:40px;cursor:not-allowed;border-color:#E8E2D5}
.lk svg{position:absolute;right:13px;top:15px;color:#8C8C92}
.lkb{background:0;border:0;color:var(--gd);font-weight:700;padding:6px 0;font-size:13px}.lkb:hover{text-decoration:underline}
.err{font-size:12px;color:var(--bd);margin-top:4px}.why{font-size:12px;color:var(--mu);margin-top:8px}
.pw{position:relative}.pw .in{padding-right:44px}.pw button{position:absolute;right:4px;top:3px;width:40px;height:40px;border:0;background:0;color:var(--mu);border-radius:8px}
.cl{display:grid;gap:8px;margin:14px 0 4px;font-size:13.5px;color:#6F6C64}.cl div{display:flex;align-items:center;gap:10px}
.cl i{width:20px;height:20px;border-radius:50%;background:#C9C5BB;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}.cl .k{color:var(--ok)}.cl .k i{background:var(--ok)}
.ab{border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:13px}.ab.w{background:var(--wnb);color:#5C3508}.ab.g{background:var(--okb);color:#14502F}.ab b{display:block}
.bt{width:100%;min-height:46px;border-radius:8px;border:1px solid var(--gd);background:var(--gd);color:#fff;font-weight:700;margin-top:18px}
.bt:hover{background:#915010}.bt:disabled{background:#D9D5CC;border-color:#D9D5CC;color:#8C8C92;cursor:not-allowed}
.bt.o{background:#fff;color:var(--ink);border-color:var(--ln)}.bt.o:hover{background:var(--gyb)}
.ctr{text-align:center;padding:8px 0}.ic{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.ic.ok{background:var(--okb);color:var(--ok)}
.kv{border:1px solid var(--ln);border-radius:12px;margin:16px 0;text-align:left}.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln)}.kv div:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:right}
.fc{display:flex;gap:10px;align-items:center;border:1px solid #E8E2D5;border-radius:8px;padding:10px 12px;background:var(--gyb);color:#6F6C64}
.fr{max-width:640px;margin:32px auto 0;background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.fb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--ln);background:var(--thb)}
.dm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--thc);background:#fff;border:1px solid var(--thl);border-radius:99px;padding:3px 10px}
.mh{display:grid;gap:4px;padding:16px 20px;border-bottom:1px solid var(--ln);font-size:13px}.mh b{font-size:16px}
.bd0{padding:24px}.mt{margin:20px 0 6px;display:inline-block;background:var(--g);color:#fff;font-weight:700;border:0;border-radius:10px;padding:12px 22px;min-height:44px}.mt:hover{background:var(--gd)}
.cap{max-width:640px;margin:12px auto 0;color:var(--mu);font-size:12px;padding:0 4px}

.lb{font:700 10px/1 var(--as-body);letter-spacing:.08em;color:var(--as-ink-soft)}

.bt:disabled{background:var(--as-line);border-color:var(--as-line);color:var(--as-ink-faint)}.bt.o{background:#fff;color:var(--as-ink);border-color:var(--as-line-strong)}.bt.o:hover{background:var(--as-bg-alt)}

.fb{background:var(--as-bg-alt);border-bottom:1px solid var(--as-line)}.dm{font:700 10px var(--as-body);color:var(--as-ink-soft);border-color:var(--as-line);background:#fff}
.mh{border-bottom:1px solid var(--as-line)}.fr{border-radius:12px}

function pwBlock(){const pe=pwErr(),o=pwOk(),ck=(t,k)=>`<div class="${k?'k':''}"><i>${k?'✓':''}</i>${t}</div>`,ty=S.sp?'text':'password';
 return`<h2>Buat Password</h2><div class="fm"><div class="w"><div class="lb"><span>Password</span></div><div class="pw"><input class="in" data-f="_pw" type="${ty}" value="${E(S.pw)}" autocomplete="new-password" placeholder="8–16 karakter, huruf dan angka"><button type="button" data-a="eye" aria-label="Tampilkan atau sembunyikan password">${S.sp?IC.eyeoff:IC.eye}</button></div></div>
 <div class="w"><div class="lb"><span>Konfirmasi Password</span></div><div class="pw"><input class="in ${pe&&S.p2?'bad':''}" data-f="_p2" type="${ty}" value="${E(S.p2)}" autocomplete="new-password" placeholder="Ulangi password"></div>${pe&&S.p2?`<div class="err">${E(pe)}</div>`:''}</div></div>
 <div class="cl">${ck('8 sampai 16 karakter',o.len)}${ck('Memuat huruf',o.let)}${ck('Memuat angka',o.num)}${ck('Konfirmasi sama dengan password',o.same)}</div>`}
function form(){const c=cur(),n=needN();
 return`<div class="eb">AKTIVASI AKUN</div><h1>Konfirmasi data dan buat password</h1><p class="s" style="margin:0">Data di bawah sudah diisi saat pendaftaran akun Anda. Periksa kembali, lalu buat password untuk mengaktifkan akun.</p>
 <div class="cdx"><p class="nt">Kolom bergembok tidak dapat diubah di sini. Jika ada data yang keliru, hubungi tim Asthara yang mengundang Anda.</p>
 ${c.gr.map((g,gi)=>`${gi==0&&c.gr.length==1||gi==0&&!c.oa&&c.gr[0].h=='Data Diri'?'':`<h2>${E(g.h)}</h2>`}<div class="fm">${g.fs.map(x=>x.file?`<div class="w"><div class="lb"><span>Dokumen</span></div><div class="fm" style="gap:10px">${x.file.map(d=>`<div class="fc">${IC.file}<div style="min-width:0"><b style="display:block;font-size:13px;color:var(--ink)">${E(d[0])}</b><span style="font-size:12px">${E(d[1])} · ${d[2]}</span></div><span style="margin-left:auto">${IC.lock}</span></div>`).join('')}</div></div>`:fld(x)).join('')}</div>`).join('')}
 ${pwBlock()}
 <div class="why" style="margin-top:14px">Setelah aktif, Anda masuk dengan email dan password ini.</div>
 <button class="bt" data-a="go" ${canGo()&&!S.busy?'':'disabled'}>${S.busy?'Memproses…':'Aktifkan Akun'}</button>${canGo()||S.busy?'':`<div class="why">${n?n+' kolom perlu dilengkapi. ':''}${pwDone()?'':'Password dan konfirmasi belum memenuhi aturan.'}</div>`}</div>`}
function emailV(){const c=cur();
 return`<div class="mh"><span class="s">Dari: Click Asthara</span><span class="s">Kepada: ${E(mail(c))}</span><b>Aktifkan akun Click Asthara Anda</b><span class="s">${E(S.sent)}</span></div>
 <div class="bd0"><div style="margin-bottom:14px">${LG(40)}</div><p>Halo ${E(nm(c))},</p><p>${E(c.by)} telah mendaftarkan Anda sebagai <b>${E(rolenm(c))}</b> di Click Asthara. Klik tombol berikut untuk memeriksa data Anda, lalu buat password dan konfirmasi password untuk mengaktifkan akun.</p>
 <div style="text-align:center"><button class="mt" data-a="open">Aktifkan Akun</button></div>
 <p class="s" style="font-size:12.5px">Tautan berlaku <b>72 jam</b> dan hanya dapat dipakai satu kali. Jika Anda tidak merasa mendaftar, abaikan email ini.</p></div>`}
function notif(){const c=cur();
 return`<div class="mh"><span class="s">Layar pendaftar · ${E(c.by)}</span><b>Akun tersimpan</b></div>
 <div class="bd0"><p style="margin-top:0"><b>${E(nm(c))}</b> didaftarkan sebagai <b>${E(rolenm(c))}</b>. Akun internal tidak memakai email undangan dan tidak ada halaman aktivasi.</p>
 <div class="ab g" style="margin:0"><b>Silakan login melalui URL ini</b><span style="word-break:break-all">${LOGIN_URL}</span></div>
 <p class="s" style="font-size:12.5px">Login memakai akun Microsoft ${E(mail(c))} (SSO). Password tidak diatur di Click.</p>
 <div style="text-align:center"><button class="mt" data-a="open">Buka URL login</button></div></div>`}
function loginInt(){return''}
function bpWeb(){return`<aside class="bp"><div><div class="lkx" style="display:flex;align-items:center;gap:14px">${LG(64)}<div style="line-height:1.05"><div style="font-weight:700;font-size:30px;letter-spacing:.04em;color:#C88246">ASTHARA</div><div style="font-weight:700;font-size:26px;letter-spacing:.1em;color:#9A9BA3;margin-top:4px">CLICK</div></div></div><div style="color:#F5C896;font-weight:600;margin-top:18px">PT Bumi Bandara Indah</div></div><div><h2>ASTHARA <span>CLICK</span></h2><div style="font-size:18px;margin-top:10px">Commercial Catalog &amp; Campaign Management</div><p>Sistem informasi terpusat untuk mempermudah akses katalog unit dan campaign penjualan secara optimal.</p></div><small>&copy; 2026 PT Bumi Bandara Indah &middot; Confidential</small></aside>`}
function loginWeb(){return`<div class="lg">${bpWeb()}<main class="fw2"><div><div><div class="eb">LOGIN</div><h1>Masuk ke Asthara CLICK</h1><p class="s" style="margin:0">Akun internal masuk dengan SSO Microsoft. Office Agent dan Sales Agent memakai email dan password yang dibuat saat aktivasi akun.</p></div><button class="bt" style="margin-top:0;min-height:44px" data-a="go" ${S.busy?'disabled':''}>${S.busy?'Memproses…':'Masuk dengan SSO Asthara'}</button><div class="s" style="text-align:center">Akun internal tidak memakai email undangan: login lewat URL internal. Akun eksternal dibuat lewat email undangan dari tim Asthara.</div></div></main></div>`}
function done(){const c=cur();
 if(!isExt(c))return`<div class="ctr"><span class="ic ok">${IC.ok}</span><h1>Login berhasil</h1><p class="s">Selamat datang, ${E(nm(c))}. Akun Anda aktif sejak login pertama melalui SSO Microsoft.</p></div><button class="bt" data-a="dash">Lanjut ke ${E(c.dash)}</button>`;
 return`<div class="ctr"><span class="ic ok">${IC.ok}</span><h1>Akun berhasil diaktifkan</h1><p class="s">Selamat datang, ${E(nm(c))}. Anda sudah masuk dan tidak perlu login ulang.</p></div>
 <button class="bt" data-a="dash">Lanjut ke ${E(c.dash)}</button>`}
function dash(){const c=cur();return`<div class="ctr"><span class="ic ok">${IC.ok}</span><h1>${E(c.dash)}</h1><p class="s">Pada titik ini pengguna masuk ke dashboard sesuai role. Tampilannya mengikuti prototype Click v2 untuk role ${E(rolenm(c))}.</p></div><button class="bt o" data-a="again">Ulangi simulasi ini</button>`}
const STEPS=()=>isExt(cur())?['Email','Aktivasi','Berhasil']:['Notifikasi','Login SSO','Berhasil'];
function bar(){const st=Math.min(S.step,2);
 return`<div class="bar"><b>Simulasi</b><select data-a="selsc" aria-label="Akun simulasi"><optgroup label="Akun eksternal (email + password)">${ORDER.filter(k=>SC[k].dom=='Publik').map(k=>`<option value="${k}" ${S.sc==k?'selected':''}>${E(SC[k].lbl)}</option>`).join('')}</optgroup><optgroup label="Akun internal (tanpa email, SSO)">${ORDER.filter(k=>SC[k].dom=='Internal').map(k=>`<option value="${k}" ${S.sc==k?'selected':''}>${E(SC[k].lbl)}</option>`).join('')}</optgroup></select>
 <div class="sg">${STEPS().map((x,i)=>`<button class="bs ${st==i?'on':''}" data-a="step" data-i="${i}" ${S.maxS<i?'disabled':''}>${i+1}. ${x}</button>`).join('')}</div></div>`}
function brand(){return`<aside class="bp2"><div>${LG(52)}<div class="t">PT Bumi Bandara Indah</div></div><div class="k"><h2>ASTHARA <span>CLICK</span></h2><h3>Commercial Catalog &amp; Campaign Management</h3><p>Sistem informasi terpusat untuk mempermudah akses katalog unit dan campaign penjualan secara optimal.</p></div><div class="f">© 2026 PT Bumi Bandara Indah · Confidential</div></aside>`}
function stage(){const c=cur(),ext=isExt(c);
 if(S.step==0)return`<main class="fw"><div class="fr"><div class="fb"><b style="font-size:13px">${ext?'Kotak masuk':'Layar pendaftar'}</b><span class="dm">Domain ${E(c.dom)}</span></div>${ext?emailV():notif()}</div><div class="cap">${ext?'Email undangan dikirim otomatis setelah pendaftar menyimpan data (hanya Office Agent dan Sales Agent). Simulasi: email sungguhan tidak dikirim.':'Akun internal: setelah pendaftar menekan Simpan, muncul notifikasi dengan URL login. Tidak ada email.'}</div></main>`;
 if(S.step==1&&!ext)return loginWeb();
 const body=S.step==1?form():S.step==2?done():dash();
 return`<div class="sx">${brand()}<main class="fw"><div class="in2">${body}</div></main></div>`}
function render(){const a=document.activeElement,k=a&&a.dataset&&a.dataset.f,pos=a&&a.selectionStart;const y=window.scrollY;
 document.getElementById('app').innerHTML=bar()+stage();window.scrollTo(0,y);
 if(k){const n=document.querySelector(`[data-f="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}}
function toast(m){const t=document.createElement('div');t.className='ts';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a=='step'){S.step=+b.dataset.i;render()}
 else if(a=='open'){S.step=1;S.maxS=Math.max(S.maxS,1);render();window.scrollTo(0,0)}
 else if(a=='eye'){S.sp=S.sp?0:1;render()}
 else if(a=='rv'){S.rv=S.rv||{};const k=b.dataset.i;S.rv[k]=!S.rv[k];if(S.rv[k])toast(k=='nr'?'Nomor rekening ditampilkan. Tindakan dicatat.':'Nomor KTP ditampilkan. Tindakan dicatat.');render()}
 else if(a=='go'){S.busy=1;render();setTimeout(()=>{S.busy=0;S.step=2;S.maxS=2;render();window.scrollTo(0,0)},350)}
 else if(a=='dash'){S.step=3;S.maxS=3;render();window.scrollTo(0,0)}
 else if(a=='again'){reset(S.sc);render();window.scrollTo(0,0)}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a=='selsc'){reset(e.target.value);render();window.scrollTo(0,0)}});
document.addEventListener('input',e=>{const d=e.target.dataset&&e.target.dataset.f;if(!d)return;if(d=='_pw')S.pw=e.target.value;else if(d=='_p2')S.p2=e.target.value;else S.fd[d]=e.target.value;render()});
reset('sa');render();
</script></body></html>
