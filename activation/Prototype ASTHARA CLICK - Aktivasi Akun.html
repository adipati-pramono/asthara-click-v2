<style>
:root{--ink:#1F2230;--sl:#2E2F3A;--g:#BE8551;--gd:#AB7544;--bg:#F4F5F7;--cd:#fff;--ln:#E8E4DB;--mu:#6B6F7B;--ok:#1F7A4B;--okb:#E1F2E8;--wn:#8A4F0E;--wnb:#FCEBD0;--bd:#A12B3D;--bdb:#F8DDE2;--in:#2B5C9E;--inb:#E2ECF8;--gyb:#F0EDE6;--inp:#fff;--thc:#A3633B;--thb:#FAF6EE;--thl:#EFE3D0}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans','DM Sans',system-ui,sans-serif}
button,select{font:inherit}button{cursor:pointer}
.bar{position:sticky;top:0;z-index:6;background:var(--sl);color:#D4D1DE;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;min-height:52px}
.bar b{color:#E9C79A;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.bar select{background:#3A3C4B;color:#fff;border:1px solid #4A4C5D;border-radius:8px;min-height:36px;padding:0 10px;max-width:260px}
.bs{background:0;border:1px solid #4A4C5D;color:#D4D1DE;border-radius:8px;min-height:36px;padding:0 12px;font-size:13px}.bs:hover{background:#383A4B}.bs.on{background:rgba(190,133,81,.35);color:#fff;border-color:var(--g)}.bs:disabled{opacity:.4;cursor:default}
.sg{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.rp{position:absolute;right:16px;top:50px;width:380px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--ln);border-radius:12px;box-shadow:0 12px 40px rgba(20,22,32,.25);padding:14px 16px}
.rp h4{margin:0 0 6px;font-size:14px}.rp .n{font-size:12px;color:var(--mu);margin:0 0 6px}
.rw{padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px}.rw div{display:flex;justify-content:space-between;gap:8px;align-items:center}.rw .w{display:block;color:var(--mu);font-size:12px}
.tg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}.tg.l{background:var(--bdb);color:var(--bd)}.tg.e{background:var(--okb);color:var(--ok)}.tg.o{background:var(--gyb);color:#555A66}
.sx{display:flex;min-height:calc(100vh - 52px)}
.bp2{width:36%;max-width:480px;flex:none;margin:16px;border-radius:24px;padding:48px 52px;color:#fff;display:flex;flex-direction:column;gap:40px;background:radial-gradient(circle at 85% 8%,rgba(176,128,80,.3),rgba(176,128,80,0) 45%),#2E3040;position:sticky;top:68px;height:calc(100vh - 84px)}
.bp2 .t{color:#E9C79A;font-weight:600;font-size:14px;margin-top:22px}
.bp2 .k{margin-top:auto}.bp2 .k h2{margin:0;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.01em;color:#fff}.bp2 .k h2 span{color:#C48A52}
.bp2 .k h3{margin:14px 0 0;font-size:20px;line-height:1.25;color:#fff}.bp2 .k p{margin:18px 0 0;color:#A9ABB8;font-size:15px;font-weight:600;line-height:1.6;max-width:360px}
.bp2 .f{margin-top:auto;color:#8A8C9A;font-size:12px;font-weight:600}
.fw{flex:1;min-width:0;padding:44px 32px 64px}.fw>.in2{max-width:560px;margin:0 auto}
.eb{font-size:12px;font-weight:700;letter-spacing:.1em;color:#8A5A1E}
h1{margin:2px 0 6px;font-size:28px;line-height:1.2;letter-spacing:-.01em}.s{color:var(--mu)}
.cdx{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:20px;margin-top:20px}
.nt{margin:0 0 14px;font-size:13px;color:#6E6A60}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fm .w{grid-column:1/-1}
h2{margin:22px 0 12px;font-size:15px}
.lb{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555A66;margin:0 0 6px}
.lb em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:600}.lb .fx{color:var(--wn)}.lb .op{color:var(--mu);font-weight:500}
.in{width:100%;min-height:46px;border:1px solid #E1DDD3;border-radius:8px;background:#fff;color:var(--ink);padding:0 14px;font:inherit}
.in:focus{outline:2px solid rgba(190,133,81,.45);border-color:var(--g)}
.in.need{border-color:#E3B76B;background:#FFFBF2}.in.bad{border-color:var(--bd)}
.lk{position:relative}.lk .in{background:var(--gyb);color:#6F6C64;padding-right:40px;cursor:not-allowed;border-color:#E6E1D6}
.lk svg{position:absolute;right:13px;top:15px;color:#8C8C92}
.err{font-size:12px;color:var(--bd);margin-top:4px}.why{font-size:12px;color:var(--mu);margin-top:8px}
.pw{position:relative}.pw .in{padding-right:44px}.pw button{position:absolute;right:4px;top:3px;width:40px;height:40px;border:0;background:0;color:var(--mu);border-radius:8px}
.cl{display:grid;gap:8px;margin:14px 0 4px;font-size:13.5px;color:#6F6C64}.cl div{display:flex;align-items:center;gap:10px}
.cl i{width:20px;height:20px;border-radius:50%;background:var(--gyb);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}.cl .k{color:var(--ok)}.cl .k i{background:var(--ok)}
.ab{border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:13px}.ab.w{background:var(--wnb);color:#5C3508}.ab b{display:block}
.bt{width:100%;min-height:46px;border-radius:8px;border:1px solid var(--gd);background:var(--gd);color:#fff;font-weight:700;margin-top:18px}
.bt:hover{background:#9A6638}.bt:disabled{background:#D9D5CC;border-color:#D9D5CC;color:#8C8C92;cursor:not-allowed}
.bt.o{background:#fff;color:var(--ink);border-color:var(--ln)}.bt.o:hover{background:var(--gyb)}
.ctr{text-align:center;padding:8px 0}.ic{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.ic.ok{background:var(--okb);color:var(--ok)}.ic.wn{background:var(--wnb);color:var(--wn)}.ic.bd{background:var(--bdb);color:var(--bd)}
.kv{border:1px solid var(--ln);border-radius:12px;margin:16px 0;text-align:left}.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln)}.kv div:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:right}
.lg{background:var(--thb);border:1px solid var(--thl);border-radius:12px;padding:12px 14px;text-align:left;font-size:12.5px;margin-top:12px}.lg b{color:var(--thc)}
.fc{display:flex;gap:10px;align-items:center;border:1px solid #E6E1D6;border-radius:8px;padding:10px 12px;background:var(--gyb);color:#6F6C64}
.fr{max-width:640px;margin:32px auto 0;background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.fb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--ln);background:var(--thb)}
.dm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--thc);background:#fff;border:1px solid var(--thl);border-radius:99px;padding:3px 10px}
.mh{display:grid;gap:4px;padding:16px 20px;border-bottom:1px solid var(--ln);font-size:13px}.mh b{font-size:16px}
.bd0{padding:24px}.mt{margin:20px 0 6px;display:inline-block;background:var(--g);color:#fff;font-weight:700;border:0;border-radius:10px;padding:12px 22px;min-height:44px}.mt:hover{background:var(--gd)}
.cap{max-width:640px;margin:12px auto 0;color:var(--mu);font-size:12px;padding:0 4px}
.ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sl);color:#fff;padding:10px 18px;border-radius:10px;z-index:10}
@media(max-width:900px){.bp2{display:none}.fw{padding:24px 16px 48px}.fm{grid-template-columns:1fr}.sg{margin-left:0;width:100%}.rp{position:fixed;left:12px;right:12px;top:auto;bottom:12px;width:auto;max-width:none}h1{font-size:24px}}
