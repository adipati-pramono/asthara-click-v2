.asp{max-height:280px;overflow:auto;border:1px solid var(--ln);border-radius:12px;padding:6px 12px;margin-top:8px;background:#fff}.asg,.asi{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}.asg{border-bottom:1px solid var(--ln);margin-top:4px}.asi{padding-left:26px;font-size:14px}
.asg2{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff}.asg2 .asp{border:0;padding:0;margin-top:6px;border-top:1px solid var(--ln)}
.md{max-height:92vh;overflow-y:auto}

.bellw{position:relative}.bell{position:relative;background:0;border:0;cursor:pointer;color:inherit;padding:8px;border-radius:10px;display:inline-flex}.bell:hover{background:rgba(0,0,0,.05)}
.bell .bdg{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:#B0024A;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bln{position:absolute;right:0;top:calc(100% + 8px);width:360px;max-height:70vh;overflow:auto;background:var(--cd);border:1px solid var(--ln);border-radius:14px;box-shadow:0 12px 32px rgba(20,22,32,.16);z-index:9}
.blh{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--ln)}.bli{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:0;border:0;border-bottom:1px solid var(--ln);padding:12px 16px;cursor:pointer;font:inherit}.bli:hover{background:#F3EFE7}.bli:last-child{border-bottom:0}
@media(max-width:700px){.bln{position:fixed;left:12px;right:12px;top:62px;width:auto}}
.rgl{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}.rgl .rr1{position:sticky;top:80px}.rg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rg2>.rfw{grid-column:1/-1}
@media(max-width:900px){.rgl{grid-template-columns:1fr}.rgl .rr1{position:static}.rg2{grid-template-columns:1fr}}

.lnh{max-height:170px;overflow:auto;border:1px solid var(--ln);border-radius:12px;padding:4px 12px;background:var(--bg)}.lni{padding:8px 0;border-bottom:1px solid var(--ln)}.lni:last-child{border-bottom:0}

.bdt{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#B0024A;border:2px solid #fff;box-sizing:content-box}

.cvw{max-width:1180px}.cvw .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:stretch}.cvw .cc{display:flex;flex-direction:column;gap:16px;min-width:0}.cvw .cc>.cd{margin:0!important}.cvw .cc>.cd:last-child{flex:1}

/* ===== Asthara Design System v1.0 (tokens, tipografi, komponen) ===== */
body{font:13px/1.5 var(--as-body);font-variant-numeric:lining-nums;color:var(--as-ink);background:var(--as-bg)}
h1,h2,h3,.ph h1{font-family:var(--as-display);color:var(--as-ink);letter-spacing:-.01em}
h1,.ph h1{font-size:24px;line-height:1.25;font-weight:700}h2{font-size:16px;font-weight:700}
.s,.hn{color:var(--as-ink-soft)}.s{font-size:12px}
code{font:600 12px var(--as-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--as-focus)}
/* tombol */
.btn{font:600 13px/1 var(--as-body);min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--as-line-strong);background:#fff;color:var(--as-ink);transition:background .12s cubic-bezier(.2,.8,.2,1),border-color .12s}
.btn:hover{background:var(--as-bg-alt)}
.btn.p,.ph .btn.p{background:var(--as-gold);border-color:var(--as-gold);color:#fff;min-height:40px;padding:0 16px;font-size:13px;border-radius:8px}.btn.p:hover{background:var(--as-gold-deep);border-color:var(--as-gold-deep)}
.btn.r{color:#B0024A;border-color:#B0024A;background:#fff}.btn.r:hover{background:#FCE3EE}
.btn.z{min-height:32px;padding:0 12px;font-size:12px;border-radius:6px}
.btn:disabled,.btn.dis{background:var(--as-line);border-color:var(--as-line);color:var(--as-ink-faint);cursor:not-allowed}
.ib{border-radius:8px}.ib:hover{background:var(--as-bg-alt)}
/* input */
.fin{font:400 13px/1.4 var(--as-body);min-height:40px;border:1px solid var(--as-line-strong);border-radius:8px;background:#fff;color:var(--as-ink);padding:0 12px;transition:box-shadow .12s,border-color .12s}
.fin:focus{outline:none;border-color:var(--as-gold);box-shadow:var(--as-focus)}
.fin[readonly],.fin:disabled{background:var(--as-bg-alt);color:var(--as-ink-soft)}
select.fin{background-color:#fff}
.lb,.sc label{font:700 10px/1 var(--as-body);letter-spacing:.08em;text-transform:uppercase;color:var(--as-ink-soft)}
.lb{margin:0 0 6px}.er{color:#B0024A}
/* badge */
.pl{font:600 11px/1 var(--as-body);padding:5px 10px;border-radius:9999px;margin:2px 4px 2px 0}
.ok{background:#E6F5EE;color:#00875A}.wn{background:#FFF1DE;color:#B45309}.bd{background:#FCE3EE;color:#B0024A}.in{}.gy{background:#EEEBE2;color:#6B6859}.dk{background:var(--as-ink);color:#fff}.go{background:var(--as-gold-tint);color:var(--as-gold-deep)}
span.in,.pl.in{background:#E3EEFD;color:#1F6CC9}
/* KPI */
.sc,.kp{background:#fff;border:1px solid var(--as-line);border-radius:12px;padding:14px 16px}
.sc b,.kp b{font:700 30px/1 var(--as-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em;color:var(--as-ink)}
.sc.w,.kp.w{background:var(--as-gold-tint);border-color:var(--as-gold-soft)}.sc.w b{color:var(--as-gold-deep)}.sc.w label,.sc.w small{color:var(--as-ink-soft)}
/* kartu, tabel, modal */
.cd{background:#fff;border:1px solid var(--as-line);border-radius:12px}
th{background:var(--as-bg-alt);color:var(--as-ink-soft);font:700 10px/1.2 var(--as-body);letter-spacing:.08em;border-top:1px solid var(--as-line);border-bottom:1px solid var(--as-line-strong);padding:11px 16px}
td{font-size:13px;padding:12px 16px;border-bottom:1px solid var(--as-line);font-variant-numeric:tabular-nums lining-nums}
tr.og td{background:var(--as-bg-alt)}
.ov{background:rgba(46,47,59,.5)}.md{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(46,47,59,.18)}.md h2{font-size:18px}
.mc,.mc2{border:1px solid var(--as-line);border-radius:8px}
.al{background:#FCE3EE;color:#B0024A;border-radius:8px}.al2{background:var(--as-gold-tint);border-radius:8px;box-shadow:inset 3px 0 0 var(--as-gold);color:var(--as-ink);font-size:12.5px}
.ts{background:var(--as-ink);border-radius:8px;box-shadow:0 8px 24px rgba(46,47,59,.10)}
.dzb{background:var(--as-gold-tint);border-color:var(--as-gold-soft);border-radius:8px}.dz,.btn.dz{border-color:var(--as-gold);color:var(--as-gold-deep)}
.fbx{border-color:var(--as-line);border-radius:8px}.chp{background:var(--as-bg-alt);border-radius:6px}.cnt{border-color:var(--as-line)}
/* tab: pill (filter) dan underline (halaman) */
div.tab2{display:inline-flex;gap:4px;padding:4px;background:var(--as-bg-alt);border-radius:9999px;margin:0 0 14px;flex-wrap:wrap}
div.tab2 button{border:0;background:transparent;border-radius:9999px;padding:7px 14px;font:600 12px/1 var(--as-body);color:var(--as-ink-soft);cursor:pointer}
div.tab2 button.on{background:#fff;color:var(--as-ink);border:0;box-shadow:0 1px 2px rgba(0,0,0,.06)}div.tab2 button:disabled{opacity:.6;cursor:default}
.rtb{border-bottom:1px solid var(--as-line)}.rtb button{font:600 13px/1 var(--as-body);color:var(--as-ink-soft);padding:12px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}.rtb button[aria-selected=true]{color:var(--as-gold-deep);border-bottom-color:var(--as-gold)}
.pb{border-radius:8px;font:600 12px var(--as-body)}.pb.on{background:var(--as-gold);color:#fff}
.bc{background:#fff;border-bottom:1px solid var(--as-line);color:var(--as-ink-soft);font-size:12px}.bc b{color:var(--as-ink)}
.ov2,.ov3{font:700 10px/1 var(--as-body);letter-spacing:.12em;text-transform:uppercase;color:var(--as-gold-deep)}.ph .s{color:var(--as-ink-soft)}
.accm{border-radius:12px;box-shadow:0 8px 24px rgba(46,47,59,.10);border-color:var(--as-line)}
/* halaman login */
.bp,.bp2{background:radial-gradient(ellipse at 72% 0%,rgba(200,130,70,.30),rgba(200,130,70,0) 60%),linear-gradient(180deg,#2E2F3B,#383947);border-radius:18px}
.bp2 .k{color:var(--as-gold-soft);font:700 12px var(--as-display);letter-spacing:.18em}.bp2 h2,.bp h2{font-family:var(--as-display);font-weight:700}.bp2 .sc2{font-family:var(--as-script);font-size:64px;color:var(--as-gold-soft);line-height:1}
.bp h2,.bp2 h2{color:#fff}.bp h2 span{color:var(--as-gold)}.bp2 p,.bp p{color:rgba(255,255,255,.62)}.lk,.lkb{color:var(--as-gold-deep)}.dv{font:700 10px var(--as-body);color:var(--as-ink-faint)}
</style>
