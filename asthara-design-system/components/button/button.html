<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · Asthara components</title>
<link rel="icon" href="../../favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../../foundation/asthara.css">
<link rel="stylesheet" href="button.css">
<link rel="stylesheet" href="../../docs/demo.css">
</head>
<body>
<main class="demo">
  <a class="demo-back" href="../../index.html">All components</a>
  <h1 class="as-h1 demo-title">Button</h1>
  <p class="as-body demo-lede">Actions. One gold primary per surface; secondary, ghost, success and danger around it, in three sizes.</p>

  <div class="stage stage--button">
<!-- ===== Copy from here ===== -->
<!-- Variants -->
<button type="button" class="as-btn as-btn--primary">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  New request
</button>
<button type="button" class="as-btn as-btn--secondary">Export</button>
<button type="button" class="as-btn as-btn--ghost">Filters</button>
<button type="button" class="as-btn as-btn--success">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  Approve
</button>
<button type="button" class="as-btn as-btn--danger">Reject</button>
<button type="button" class="as-btn as-btn--primary" disabled>Disabled</button>

<!-- Sizes -->
<button type="button" class="as-btn as-btn--primary as-btn--sm">Small</button>
<button type="button" class="as-btn as-btn--primary">Medium</button>
<button type="button" class="as-btn as-btn--primary as-btn--lg">Large</button>
<!-- ===== to here ===== -->
  </div>
</main>

</body>
</html>
