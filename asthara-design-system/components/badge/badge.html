<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges · Asthara components</title>
<link rel="icon" href="../../favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../../foundation/asthara.css">
<link rel="stylesheet" href="badge.css">
<link rel="stylesheet" href="../../docs/demo.css">
</head>
<body>
<main class="demo">
  <a class="demo-back" href="../../index.html">All components</a>
  <h1 class="as-h1 demo-title">Badges</h1>
  <p class="as-body demo-lede">Status badges with a dot, priority tags and neutral tags.</p>

  <div class="stage stage--badge">
<!-- ===== Copy from here ===== -->
<!-- Status badges -->
<span class="as-badge as-badge--draft"><span class="as-badge__dot"></span>Draft</span>
<span class="as-badge as-badge--submitted"><span class="as-badge__dot"></span>Submitted</span>
<span class="as-badge as-badge--in-review"><span class="as-badge__dot"></span>In Review</span>
<span class="as-badge as-badge--revision"><span class="as-badge__dot"></span>Revision</span>
<span class="as-badge as-badge--approved"><span class="as-badge__dot"></span>Approved</span>
<span class="as-badge as-badge--rejected"><span class="as-badge__dot"></span>Rejected</span>
<span class="as-badge as-badge--checked-in"><span class="as-badge__dot"></span>Checked In</span>

<!-- Priority tags -->
<span class="as-priority as-priority--regular">Regular</span>
<span class="as-priority as-priority--urgent">Urgent</span>
<span class="as-priority as-priority--emergency"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Emergency</span>

<!-- Neutral tags -->
<span class="as-tag">F&amp;B</span>
<span class="as-tag">ASM</span>
<span class="as-tag">All projects</span>
<span class="as-tag">Last 7 days</span>
<!-- ===== to here ===== -->
  </div>
</main>

</body>
</html>
