<style>
:root{--ink:#1F2230;--sl:#2E2F3A;--g:#BE8551;--gd:#BE8551;--bg:#FAF8F4;--cd:#fff;--ln:#EDE8DF;--mu:#6B6F7B;--ok:#1F7A4B;--okb:#E1F2E8;--wn:#8A4F0E;--wnb:#FCEBD0;--bd:#A12B3D;--bdb:#F8DDE2;--in:#2B5C9E;--inb:#E2ECF8;--gy:#555A66;--gyb:#ECE9E1;--gob:#F1E7D4;--gof:#7A4A18;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}
.app{display:flex;min-height:100%}.sb{width:248px;flex:none;background:var(--sl);color:#D4D1DE;padding:20px 12px;overflow:auto}
.br{font-weight:700;font-size:19px;color:#fff;padding:0 12px 14px}.br small{display:block;font-size:12px;color:#B9A58B;font-weight:500}
.nv{display:block;width:100%;text-align:left;background:0;border:0;color:inherit;font:inherit;padding:8px 12px;border-radius:8px;cursor:pointer}.nv.sub{padding-left:24px;font-size:13px}.nv:hover{background:#3A3C50}.nv.on{background:rgba(196,138,78,.24);color:#F3D9B8;font-weight:600}
.nh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8F8BA0;padding:14px 12px 4px}.bdg{float:right;background:var(--g);color:#2A1A08;border-radius:99px;padding:0 8px;font-size:11px;font-weight:700}
.mn{flex:1;min-width:0;padding:24px 32px 56px}.tp{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}h1{margin:0;font-size:24px}h2{margin:0 0 12px;font-size:16px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:20px;margin-bottom:16px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kp{margin:0}.kp span{color:var(--mu);font-size:13px}.kp b{display:block;font-size:30px}.kp.w{background:var(--wnb);border-color:#E7C88F}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:10px;border-bottom:1px solid var(--ln)}td{padding:12px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}tr.m td{color:var(--mu)}.s{color:var(--mu);font-size:12px}
.btn{font:inherit;font-weight:600;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);cursor:pointer}.btn:hover{background:var(--gyb)}.btn.p{background:var(--gd);border-color:var(--gd);color:#fff}.btn.p:hover{background:#8F5824}.btn.r{color:var(--bd);border-color:var(--bd)}.btn.z{min-height:34px;font-size:13px;padding:0 12px;border-radius:99px}.btn.w{width:100%}
.pl{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;white-space:nowrap}.ok{background:var(--okb);color:var(--ok)}.wn{background:var(--wnb);color:var(--wn)}.bd{background:var(--bdb);color:var(--bd)}.in{background:var(--inb);color:var(--in)}.gy{background:var(--gyb);color:var(--gy)}.dk{background:#23262F;color:#fff}.go{background:var(--gob);color:var(--gof)}
.ib{width:40px;height:40px;border:0;background:0;color:var(--mu);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.ib:hover{background:var(--gyb)}.ib.d{color:var(--bd)}
.fin{font:inherit;min-height:42px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);padding:0 12px;width:100%}.fin[readonly]{background:var(--gyb);color:var(--mu)}.er{color:var(--bd);font-size:12px;margin-top:4px}
.lb{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 6px}.fm{display:grid;gap:16px;max-width:620px}.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fl .fin{flex:1 1 160px;width:auto}.fl .fin.q{flex:3 1 240px}
.pg{display:flex;justify-content:flex-end;gap:4px;margin-top:12px}.pb{min-width:38px;height:38px;border:0;border-radius:8px;background:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}.pb.on{background:var(--gd);color:#fff}
.ov{position:fixed;inset:0;background:rgba(20,22,32,.55);display:flex;justify-content:center;align-items:center;padding:16px;z-index:9}.md{background:var(--cd);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow:auto}.md h2{font-size:20px}
.mc{border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin:12px 0;display:grid;gap:6px}.mc div{display:flex;justify-content:space-between;gap:12px}.al{background:var(--bdb);color:var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px}.al b{display:block}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sl);color:#fff;padding:10px 18px;border-radius:10px;z-index:10}
.lg{display:flex;min-height:100vh;box-sizing:border-box;align-items:stretch}.bp{width:44%;max-width:560px;flex:none;margin:16px;border-radius:24px;padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:radial-gradient(ellipse at 72% 0%,rgba(170,120,72,.5),rgba(170,120,72,0) 58%),#2E3040}.bp h2{font-size:40px;margin:0;line-height:1.1}.bp h2 span{color:var(--g)}.bp p{color:#9A9BAA;line-height:1.6}.bp small{color:#6E7080}
.fw{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}.fw>div{width:100%;max-width:440px;display:grid;gap:16px}.ov2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gd)}.lk{color:var(--gd);font-weight:600;background:0;border:0;font:inherit;cursor:pointer;padding:0}
@media(max-width:860px){.app{flex-direction:column}.sb{width:auto;max-height:44vh}.mn{padding:16px}.bp{display:none}}
.sb{width:240px;padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sbh{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid #3B3D4D;color:#E9C79A;font-weight:700;letter-spacing:.14em;font-size:13px;line-height:1.2}.sbh small{display:block;color:#C9B79B;letter-spacing:.3em;font-size:11px;font-weight:500}
.sbm{flex:1;overflow:auto;padding:8px 12px}.mh{font-size:11px;letter-spacing:.08em;color:#8F8BA0;padding:12px 8px 6px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:0;border:0;color:#D4D1DE;font:inherit;font-size:13px;padding:9px 10px;border-radius:8px;cursor:pointer}.ni:hover{background:#383A4B}.ni .ch{margin-left:auto;display:inline-flex}.ni.on{color:#fff;font-weight:600}
.ns{display:block;width:100%;text-align:left;background:0;border:0;color:#B9B6C7;font:inherit;font-size:13px;padding:9px 10px 9px 38px;border-radius:8px;cursor:pointer}.ns:hover{background:#383A4B}.ns.on{color:#fff;font-weight:600;background:linear-gradient(90deg,rgba(196,138,78,.38),rgba(196,138,78,.04))}
.sbf{border-top:1px solid #3B3D4D;padding:12px}.sbf .ni{color:#E5707F}
.mw{flex:1;min-width:0;display:flex;flex-direction:column}.bc{background:var(--cd);border-bottom:1px solid var(--ln);padding:14px 32px;font-size:13px;color:var(--mu);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.bc b{color:var(--ink)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}.ov3{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--g)}.ph h1{font-size:28px;margin:2px 0}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}.sc{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px 18px}.sc label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}.sc b{display:block;font-size:40px;line-height:1.2}.sc small{color:var(--mu);font-size:12px}.sc.w{background:var(--gob);border-color:#D9B98F}.sc.w b{color:var(--gd)}
.bp2{width:44%;max-width:560px;flex:none;margin:16px;border-radius:24px;padding:48px 52px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:radial-gradient(circle at 85% 8%,rgba(176,128,80,.3),rgba(176,128,80,0) 45%),#2E3040}.bp2 .k{color:#E9C79A;font-size:13px;font-weight:700;letter-spacing:.08em;margin-bottom:16px}.bp2 h2{font-size:42px;line-height:1.2;margin:0}.bp2 .sc2{font-family:'Great Vibes',cursive;font-weight:400;font-size:60px;color:var(--g)}.bp2 p{color:#9A9BAA;line-height:1.6;max-width:380px}
.dv{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.dv:before,.dv:after{content:"";flex:1;height:1px;background:var(--ln)}

function FVAL(id,v){const R=VR[id];if(!R)return'';v=(v||'').trim();const t=R[0],l=R[1];if(!v)return R[2]?'':l+' wajib diisi';
if(t=='nama')return v.length<3||v.length>100?l+' harus 3 sampai 100 karakter':'';
if(t=='req')return v.length>100?l+' maksimal 100 karakter':'';
if(t=='email'||t=='emailL'||t=='emailInt'){if(!EMRX.test(v))return'Masukkan alamat email yang valid';if(t=='emailInt'&&!/@asthara\.co\.id$/i.test(v))return'Gunakan email @asthara.co.id';if(t!='emailL'&&(emDup(v)||S.adm.some(x=>x.e==v)))return'Email ini sudah terdaftar pada akun lain';return''}
if(t=='idL')return v.includes('@')?(EMRX.test(v)?'':'Masukkan alamat email yang valid'):(/^[A-Za-z0-9._-]{3,50}$/.test(v)?'':'Username 3 sampai 50 karakter, hanya huruf, angka, titik, garis bawah, atau strip');
if(t=='ktp')return/^\d{16}$/.test(v)?'':'Nomor KTP harus terdiri dari 16 angka';
if(t=='hp'){const c=v.replace(/[\s-]/g,''),d=c.replace(/\D/g,'');return/^(\+62|62|0)\d+$/.test(c)&&d.length>=10&&d.length<=15?'':'No. HP harus 10 sampai 15 digit angka, diawali 08 atau +62'}
if(t=='rek')return/^\d+$/.test(v)?'':'Nomor rekening hanya boleh berisi angka';
if(t=='pos')return/^\d{5}$/.test(v)?'':'Kode pos harus 5 digit angka';
if(t=='npwp'){const n=v.replace(/\D/g,'');return n.length==15||n.length==16?'':'NPWP harus 15 atau 16 digit'}
if(t=='tgl'){if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v<'1900-01-01')return'Tanggal lahir tidak valid';return v>TD()?'Tanggal lahir tidak boleh melewati hari ini':''}
return''}
const VALALL=(ids,f)=>{const er={};ids.forEach(k=>{const m=FVAL(k,f[k]);if(m)er[k]=m});return er};
const REKG=(ids,f,er)=>{if(ids.some(k=>(f[k]||'').trim()))ids.forEach(k=>{if(!(f[k]||'').trim()&&!er[k])er[k]='Lengkapi informasi rekening'})};
function FA(id,o){const R=VR[id];if(o&&o.t=='date')return' max="'+TD()+'" min="1900-01-01"';if(!R)return'';const t=R[0];
if(t=='ktp')return' inputmode="numeric" maxlength="16" autocomplete="off"';if(t=='pos')return' inputmode="numeric" maxlength="5"';
if(t=='hp')return' inputmode="tel" maxlength="16"';if(t=='rek')return' inputmode="numeric" maxlength="20"';
if(t=='nama'||t=='req')return' maxlength="100"';if(t.startsWith('email'))return' inputmode="email" maxlength="100"';return''}
(function(){const setErr=(el,id,m)=>{const p=el.parentNode;let d=p.querySelector(':scope>.er');if(m){S.er[id]=m;if(!d){d=document.createElement('div');d.className='er';p.appendChild(d)}d.textContent=m;el.classList.add('bad')}else{delete S.er[id];if(d)d.remove();el.classList.remove('bad')}};
const ok=el=>el&&el.dataset&&el.dataset.f&&VR[el.dataset.f]&&!el.readOnly&&el.type!='password'&&el.tagName!='SELECT';
document.addEventListener('input',e=>{const el=e.target;if(!ok(el))return;const id=el.dataset.f,t=VR[id][0];let v=el.value;
if(t=='ktp'||t=='rek'||t=='pos')v=v.replace(/\D/g,'');else if(t=='hp')v=v.replace(/[^\d+\- ]/g,'');
if(v!==el.value)el.value=v;if(S.er[id]&&!FVAL(id,v))setErr(el,id,'')},true);
document.addEventListener('focusout',e=>{const el=e.target;if(!ok(el))return;const n=e.relatedTarget;if(n&&n.dataset&&n.dataset.a)return;setErr(el,el.dataset.f,FVAL(el.dataset.f,el.value))},true);
document.addEventListener('change',e=>{const el=e.target;if(ok(el)&&el.type=='date')setErr(el,el.dataset.f,FVAL(el.dataset.f,el.value))},true)})();

(function(){const lab=()=>document.querySelectorAll('.tw table').forEach(t=>{const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName=='TD'&&!c.dataset.label&&h[i])c.dataset.label=h[i];if(c.dataset.label&&c.dataset.label!='Aksi'&&i>0&&c.children.length>1&&!c.querySelector(':scope>.cv')){const w=document.createElement('span');w.className='cv';while(c.firstChild)w.appendChild(c.firstChild);c.appendChild(w)}}))});let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;lab()})}).observe(document.body,{childList:true,subtree:true});lab()})();
